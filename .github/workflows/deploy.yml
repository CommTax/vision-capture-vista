name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Debug build output
        run: |
          echo "=== Build output structure ==="
          ls -la
          echo "=== Looking for dist ==="
          ls -la dist/ 2>/dev/null || echo "no dist/"
          ls -la .output/public/ 2>/dev/null || echo "no .output/public/"
          ls -la build/ 2>/dev/null || echo "no build/"

      - name: Create 404.html for SPA Routing
        run: |
          if [ -f dist/index.html ]; then
            cp dist/index.html dist/404.html
          elif [ -f .output/public/index.html ]; then
            cp .output/public/index.html .output/public/404.html
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
